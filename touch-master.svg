<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Device Outline: Top Screen (Upper Handheld Display) -->
  <rect x="44" y="36" width="168" height="68" rx="10" fill="#090d16" stroke="#475569" stroke-width="3"/>
  <!-- Top Screen subtle content lines -->
  <line x1="58" y1="56" x2="110" y2="56" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="58" y1="72" x2="90" y2="72" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="184" cy="56" r="8" fill="#10b981" opacity="0.8"/>

  <!-- Device Hinge Divider -->
  <rect x="96" y="112" width="64" height="6" rx="3" fill="#64748b" opacity="0.7"/>

  <!-- Device Outline: Bottom Screen (Touch Master AMOLED Digitizer) -->
  <rect x="52" y="126" width="152" height="92" rx="12" fill="#040b14" stroke="url(#botGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Touchpad Glass Grid / Horizon Lines -->
  <line x1="68" y1="172" x2="188" y2="172" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.35"/>
  <line x1="128" y1="138" x2="128" y2="206" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.35"/>

  <!-- Interactive Touch Ripple Circles -->
  <circle cx="128" cy="172" r="32" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.4"/>
  <circle cx="128" cy="172" r="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
  <circle cx="128" cy="172" r="7" fill="#38bdf8" filter="url(#glow)"/>
</svg>
